<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Vibe Draw</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1e28">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="toolbar">
    <input type="color" id="colorPicker" value="#000000" title="Color">
    <label class="slider-label">
      Size
      <input type="range" id="sizeSlider" min="1" max="60" value="6">
    </label>
    <label class="slider-label">
      Opacity
      <input type="range" id="opacitySlider" min="1" max="100" value="100">
    </label>
    <button id="clearBtn">Clear Layer</button>
    <button id="saveBtn">Save PNG</button>
    <button id="layersToggleBtn">Layers</button>
  </div>

  <div id="canvasWrap">
    <canvas id="drawCanvas"></canvas>
  </div>

  <div id="layerPanel" class="hidden">
    <div id="layerPanelHeader">
      <span>Layers</span>
      <button id="addLayerBtn">+ Add</button>
    </div>
    <div id="layerList"></div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js');
      });
    }
  </script>
</body>
</html>
